[project]
name = "django-backend"
version = "1.0.0"
description = "Enterprise Django Backend Template"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = ["E501", "B008", "B904"]
exclude = ["migrations", ".venv", "venv", "__pycache__"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "ARG001"]

[tool.black]
line-length = 100
target-version = ["py313"]
exclude = "migrations"

[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations", ".venv"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.config.settings.testing"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v --tb=short --cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=90"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = ["error", "ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py", "manage.py", "*/settings/*", "*/asgi.py", "*/wsgi.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = ["B101", "B601"]
